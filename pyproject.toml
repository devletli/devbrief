[project]
name = "devbrief"
version = "0.1.0"
description = "Gunluk Turkce teknik haber videolari pipeline"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "edge-tts>=6.1",
  "pillow>=10.0",
  "pygments>=2.18",
  "structlog>=24.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.22",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
devbrief = "devbrief.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devbrief"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
